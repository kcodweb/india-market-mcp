[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "india-market-mcp"
version = "0.1.0"
description = "MCP server for Indian market data: NSE quotes, indices, option chains with analytics, company financials, shareholding, corporate actions and mutual funds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karan Bansal" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "nse", "india", "stock-market", "options", "mutual-funds", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/kcodweb/india-market-mcp"
Issues = "https://github.com/kcodweb/india-market-mcp/issues"

[project.scripts]
india-market-mcp = "india_market_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/india_market_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real NSE/Yahoo/mfapi endpoints (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
